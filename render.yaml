# ---------------------------------------------------------------------------
#  Render-blueprint voor de Marché/Bleuet kassa.
#  Maakt in één keer: een beheerde PostgreSQL-database + de online server
#  (die de kassa-API én de website serveert). Regio Frankfurt (EU / GDPR).
#
#  Plannen (plan:) en regio kan je in het Render-dashboard nog aanpassen.
#  De DATABASE_URL en AUTH_SECRET worden automatisch ingevuld/gegenereerd.
# ---------------------------------------------------------------------------

databases:
  - name: kassa-db
    databaseName: kassa
    user: kassa
    region: frankfurt
    plan: basic-256mb

services:
  - type: web
    name: kassa
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: frankfurt
    plan: starter
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: kassa-db
          property: connectionString
