}

function btwSplit(lijnen){
  const m={}; lijnen.forEach(l=>{const bruto=l.p.prijs*l.aantal;const excl=bruto/(1+l.p.btw/100);

}

  const t=totaal(); const o=parseFloat((ontvangen||'').replace(',','.'));
  if(betaal==='CASH'&&t>CASH_LIMIET){alert('Cash boven â‚¬3000 mag niet.');return;}
  if(betaal==='CASH'&&ontvangen!==''&&o<t){alert('Te weinig ontvangen.');return;}
  ticket={lijnen:cart.slice(),betaal,totaal:t,ontvangen:(betaal==='CASH'&&!isNaN(o))?o:null,
    teruggeven:(betaal==='CASH'&&!isNaN(o))?o-t:null,btw:btwSplit(cart),datum:new Date()};
  cart=[]; ontvangen=''; render();
}
function nieuw(){ ticket=null; betaal='BANCONTACT'; render(); }

function render(){
  if(ticket){ renderTicket(); return; }
  const t=totaal(); const split=btwSplit(cart);
  const o=parseFloat((ontvangen||'').replace(',','.'));
  const terug=(betaal==='CASH'&&ontvangen!==''&&!isNaN(o))?o-t:null;
  app.innerHTML = `
  <div class="col"><div class="card">
    <h2>Kassa</h2>
    <input id="scan" class="scan" placeholder="Scan of typ een barcode en druk Enter" autofocus>
    <div id="scanerr" class="err"></div>
    <input id="zoek" class="zoek" placeholder="of zoek een product op naamâ€¦">
    <div class="lijst" id="lijst"></div>
  </div></div>
  <div class="col"><div class="card">
    <table><thead><tr><th>Product</th><th style="text-align:center">Aantal</th><th style="text-align:right">Totaal</th><th></th></tr></thead>
    <tbody id="cart"></tbody></table>
    <div style="border-top:1px solid #e5e7eb;margin-top:10px;padding-top:10px">
      <div class="muted">Te betalen</div>
      <div class="tot">${euro(t)}</div>
      <div id="split" class="muted"></div>
      <div class="muted" style="margin-top:10px">Betaalwijze</div>
      <div class="bw">
        ${['BANCONTACT','KAART','CASH'].map(b=>`<button data-bw="${b}" class="${betaal===b?'on':''}">${b==='CASH'?'Cash':b==='BANCONTACT'?'Bancontact':'Kaart'}</button>`).join('')}
      </div>
      <div id="cashbox"></div>
      <button class="pay" id="pay" ${cart.length?'':'disabled'}>Afrekenen</button>
    </div>
  </div></div>`;

  // cart
  document.getElementById('cart').innerHTML = cart.length? cart.map(l=>`
    <tr><td>${l.p.naam}${l.p.alcohol?'<span class="chip">alcohol</span>':''}<br><small class="muted">${euro(l.p.prijs)} Â· ${l.p.btw}% BTW</small></td>
    <td class="qty" style="text-align:center;white-space:nowrap"><button data-q="-1" data-bc="${l.p.barcode}">âˆ’</button> <b>${l.aantal}</b> <button data-q="1" data-bc="${l.p.barcode}">+</button></td>
    <td style="text-align:right">${euro(l.p.prijs*l.aantal)}</td>
    <td style="text-align:right"><button data-del="${l.p.barcode}" style="border:none;background:none;color:#dc2626;cursor:pointer;font-size:18px">Ã—</button></td></tr>`).join('')
    : '<tr><td colspan="4" class="muted" style="padding:16px">Nog geen artikels.</td></tr>';

  document.getElementById('split').innerHTML = split.map(s=>`<div style="display:flex;justify-content:space-between"><span>BTW ${s.pct}% (maatstaf ${euro(s.maatstaf)})</span><span>${euro(s.btw)}</span></div>`).join('');

  document.getElementById('cashbox').innerHTML = betaal==='CASH' ? `
    <div style="margin-top:8px"><div class="muted">Ontvangen</div>
    <input id="ontv" class="scan" inputmode="decimal" placeholder="0,00" value="${ontvangen}">
    ${terug!=null&&terug>=0?`<div style="margin-top:6px"><b>Teruggeven: ${euro(terug)}</b></div>`:''}
    ${betaal==='CASH'&&t>CASH_LIMIET?'<div class="err">Cash boven â‚¬3000 mag niet.</div>':''}</div>` : '';

  // events
  const zoek=document.getElementById('zoek');
  function toonLijst(q){
    q=(q||'').toLowerCase();
    const res=PRODUCTEN.filter(p=>!q||p.naam.toLowerCase().includes(q)).slice(0,40);
    document.getElementById('lijst').innerHTML = res.map(p=>`<div class="pi" data-code="${p.barcode}"><span>${p.naam}${p.alcohol?'<span class="chip">alcohol</span>':''}<br><small>${p.categorie} Â· ${p.barcode}</small></span><b>${euro(p.prijs)}</b></div>`).join('');
    document.querySelectorAll('.pi').forEach(el=>el.onclick=()=>add(byCode[el.dataset.code]));
  }
  toonLijst('');
  zoek.oninput=e=>toonLijst(e.target.value);
  const s=document.getElementById('scan');
  s.onkeydown=e=>{ if(e.key==='Enter'){ if(!scan(s.value)){document.getElementById('scanerr').textContent='Geen product voor barcode '+s.value;} s.value=''; } };
  document.querySelectorAll('.bw button').forEach(b=>b.onclick=()=>{betaal=b.dataset.bw;render();});
  document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>qty(b.dataset.bc,+b.dataset.q));
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>del(b.dataset.del));
  document.getElementById('pay').onclick=afrekenen;
  const ontv=document.getElementById('ontv'); if(ontv){ontv.oninput=e=>{ontvangen=e.target.value;render();}; ontv.focus();}
}

function renderTicket(){
  const tk=ticket;
  app.innerHTML=`<div class="col"><div class="ticket">
    <div style="text-align:center;font-weight:700">KASSATICKET (demo)</div>
    <div style="text-align:center;font-size:12px;color:#6b7280">${tk.datum.toLocaleString('nl-BE')}</div>
    <div style="text-align:center;font-size:12px;color:#6b7280">Verkoper: Kassa</div><hr>
    ${tk.lijnen.map(l=>`<div class="r"><span>${l.aantal} Ã— ${l.p.naam}</span><span>${euro(l.p.prijs*l.aantal)}</span></div>`).join('')}
    <hr><div class="r" style="font-weight:800;font-size:16px"><span>TOTAAL</span><span>${euro(tk.totaal)}</span></div>
    <div style="margin-top:6px">${tk.btw.map(s=>`<div class="r" style="color:#555"><span>BTW ${s.pct}% (mtst ${euro(s.maatstaf)})</span><span>${euro(s.btw)}</span></div>`).join('')}</div>
    <hr><div class="r"><span>Betaald (${tk.betaal==='CASH'?'Cash':tk.betaal==='BANCONTACT'?'Bancontact':'Kaart'})</span><span>${euro(tk.totaal)}</span></div>
    ${tk.ontvangen!=null?`<div class="r"><span>Ontvangen</span><span>${euro(tk.ontvangen)}</span></div><div class="r" style="font-weight:700"><span>Teruggegeven</span><span>${euro(tk.teruggeven)}</span></div>`:''}
    <div style="display:flex;gap:8px;margin-top:14px">
      <button onclick="window.print()" style="flex:1;padding:11px;cursor:pointer">Afdrukken</button>
      <button id="nw" style="flex:2;padding:11px;font-weight:700;color:#fff;background:#2563eb;border:none;border-radius:7px;cursor:pointer">Nieuwe verkoop</button>
    </div>
  </div></div>`;
  document.getElementById('nw').onclick=nieuw;
}
render();
</script></body></html>
